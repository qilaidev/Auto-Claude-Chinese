name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Python linting
  python:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check auto-claude/ --output-format=github

      - name: Run ruff format check
        run: ruff format auto-claude/ --check --diff

      - name: Scan for secrets
        run: python auto-claude/security/scan_secrets.py --all-files

  # TypeScript/React linting
  frontend:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 不用 pnpm/action-setup@v4：它的自安装器在 runner 强制的 Node 24 下跑完
      # 不报错，却不生成任何二进制（~/setup-pnpm/node_modules/.bin 是空目录），
      # 下一步直接 "pnpm: command not found"。
      #
      # corepack 是 Node 自带的官方入口，而且它读 auto-claude-ui/package.json
      # 里的 "packageManager": "pnpm@10.26.1" —— 原来写死 version: 9 反而跟
      # pnpm 10 生成的锁文件对不上，--frozen-lockfile 早晚要炸。
      - name: Setup pnpm
        working-directory: auto-claude-ui
        run: |
          corepack enable pnpm
          corepack prepare --activate
          pnpm --version

      - name: Install dependencies
        working-directory: auto-claude-ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run ESLint
        working-directory: auto-claude-ui
        run: pnpm lint

      - name: Run TypeScript check
        working-directory: auto-claude-ui
        run: pnpm typecheck
