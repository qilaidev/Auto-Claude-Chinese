name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Python tests
  test-python:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: auto-claude
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../tests/requirements-test.txt

      - name: Run tests
        working-directory: auto-claude
        run: |
          source .venv/bin/activate
          pytest ../tests/ -v --tb=short -x

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        working-directory: auto-claude
        run: |
          source .venv/bin/activate
          pytest ../tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./auto-claude/coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Frontend tests
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 不用 pnpm/action-setup@v4：它的自安装器在 runner 强制的 Node 24 下跑完
      # 不报错，却不生成任何二进制（~/setup-pnpm/node_modules/.bin 是空目录），
      # 下一步直接 "pnpm: command not found"。
      #
      # corepack 是 Node 自带的官方入口，而且它读 auto-claude-ui/package.json
      # 里的 "packageManager": "pnpm@10.26.1" —— 原来写死 version: 9 反而跟
      # pnpm 10 生成的锁文件对不上，--frozen-lockfile 早晚要炸。
      - name: Setup pnpm
        working-directory: auto-claude-ui
        run: |
          corepack enable pnpm
          corepack prepare --activate
          pnpm --version

      - name: Install dependencies
        working-directory: auto-claude-ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        working-directory: auto-claude-ui
        run: pnpm test
